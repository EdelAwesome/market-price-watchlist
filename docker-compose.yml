# One-command local infra + services. Web and worker images are added as their slices land;
# postgres + redis are usable on their own now (`docker compose up postgres redis`) for dev.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mpw
      POSTGRES_PASSWORD: mpw
      POSTGRES_DB: mpw
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mpw']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    # DB 0 = BullMQ queue (no eviction). DB 1 = quote cache (LRU). maxmemory-policy is set to
    # noeviction globally; the cache layer bounds its own keys with per-key TTLs, so queue keys
    # in db0 are never evicted. See DECISIONS.md "Redis eviction isolation".
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
